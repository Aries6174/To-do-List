name: Playwright Tests

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
test:
timeout-minutes: 10
runs-on: ubuntu-latest

```
services:
  postgres:
    image: postgres:18
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_test
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U postgres -d taskflow_test"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test
  SESSION_SECRET: test-session-secret-for-ci

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Install Playwright browsers
    run: npx playwright install --with-deps chromium

  - name: Emit Prisma contract
    run: npm run contract:emit

  - name: Setup test database
    run: npx prisma db update --no-interactive --confirm taskflow_test

  - name: Run Playwright tests
    run: npx playwright test
```
